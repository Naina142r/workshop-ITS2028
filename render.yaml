services:
  - type: web
    name: lettuce-journey
    runtime: node
    plan: starter          # persistent disks need a paid plan; "free" works but data resets on redeploy/sleep
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DB_PATH
        value: /var/data/data.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
