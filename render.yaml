services:
  - type: web
    name: chive-journey
    runtime: node
    plan: starter          # persistent disks need a paid plan; "free" works but data resets on redeploy/sleep
    buildCommand: npm install
    startCommand: npm run init-db && npm start
    envVars:
      - key: DB_PATH
        value: /var/data/data.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
